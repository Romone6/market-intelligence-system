[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-event-model"
version = "0.1.0"
description = "Point-in-time financial event learning and research system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "exchange-calendars>=4.13.2,<5",
    "pydantic>=2.10,<3",
    "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
financial_event_model = [
    "identifiers/migrations/*.sql",
    "ingestion/migrations/*.sql",
    "normalization/migrations/*.sql",
    "temporal/migrations/*.sql",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
